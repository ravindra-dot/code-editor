<!DOCTYPE html>
<html lang="en">

<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>CodeSphere - HTML Editor</title>
    <!-- Tailwind CSS CDN -->
    <script src="https://cdn.tailwindcss.com"></script>
</head>

<body class="bg-slate-950 text-slate-100 min-h-screen flex flex-col font-sans antialiased">

    <!-- Navbar -->
    <header class="border-b border-slate-800 bg-slate-900/50 backdrop-blur-md sticky top-0 z-50">
        <div class="max-w-7xl mx-auto px-4 sm:px-6 lg:px-8 h-16 flex items-center justify-between">
            <h1>
                <a href="/" class="text-2xl font-extrabold tracking-tight bg-gradient-to-r from-blue-400 via-indigo-400 to-purple-500 bg-clip-text text-transparent hover:opacity-90 transition-opacity">
                    CodeSphere
                </a>
            </h1>

            <!-- Mobile Menu Toggle Button -->
            <button id="menu-toggle" class="sm:hidden text-slate-400 hover:text-white focus:outline-none">
                <svg class="w-6 h-6" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                    <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2" d="M4 6h16M4 12h16M4 18h16"></path>
                </svg>
            </button>

            <!-- Navigation Links -->
            <nav id="nav-menu" class="hidden sm:flex items-center space-x-6 text-sm font-medium">
                <a class="text-slate-300 hover:text-white transition-colors" href="/">Home</a>
                <a class="text-slate-300 hover:text-white transition-colors" href="/project">Projects</a>
                <a class="text-slate-300 hover:text-white transition-colors" href="/editor">Editor</a>
                <a class="text-slate-300 hover:text-white transition-colors" href="/profile">Profile</a>
                <a class="px-4 py-2 text-sm rounded-lg bg-rose-500/10 text-rose-400 hover:bg-rose-500 hover:text-white transition-all duration-200" href="{{ url_for('logout') }}">Logout</a>
            </nav>
        </div>

        <!-- Mobile Dropout Menu -->
        <div id="mobile-menu" class="hidden sm:hidden border-t border-slate-800 bg-slate-900 px-4 py-3 space-y-3">
            <a class="block text-slate-300 hover:text-white text-sm" href="/">Home</a>
            <a class="block text-slate-300 hover:text-white text-sm" href="/project">Projects</a>
            <a class="block text-slate-300 hover:text-white text-sm" href="/editor">Editor</a>
            <a class="block text-slate-300 hover:text-white text-sm" href="/profile">Profile</a>
            <a class="block text-center py-2 text-sm rounded-lg bg-rose-500/10 text-rose-400" href="{{ url_for('logout') }}">Logout</a>
        </div>
    </header>

    <!-- Workspace Controls Bar -->
    <div class="bg-slate-900 border-b border-slate-800 px-4 py-3">
        <div class="max-w-7xl mx-auto flex flex-col sm:flex-row items-center justify-between gap-3">
            <div class="flex items-center gap-2">
                <span class="flex h-2 w-2 rounded-full bg-emerald-500 animate-pulse"></span>
                <h2 class="text-sm font-semibold tracking-wider text-slate-300 uppercase font-mono">Web Workspace</h2>
            </div>

            <!-- Editor Toggles + Run Controls -->
            <div class="flex items-center flex-wrap gap-2">
                <button id="btn-html" onclick="toggleHTML()" class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-bold rounded-lg bg-amber-500/10 text-amber-400 border border-amber-500/30 hover:bg-amber-500/20 transition-all">
                    HTML <span id="dot-html" class="w-1.5 h-1.5 rounded-full bg-amber-400"></span>
                </button>
                <button id="btn-css" onclick="toggleCSS()" class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-bold rounded-lg bg-blue-500/10 text-blue-400 border border-blue-500/30 hover:bg-blue-500/20 transition-all">
                    CSS <span id="dot-css" class="w-1.5 h-1.5 rounded-full bg-blue-400"></span>
                </button>
                <button id="btn-js" onclick="toggleJS()" class="inline-flex items-center gap-2 px-3 py-1.5 text-xs font-bold rounded-lg bg-yellow-500/10 text-yellow-400 border border-yellow-500/30 hover:bg-yellow-500/20 transition-all">
                    JS <span id="dot-js" class="w-1.5 h-1.5 rounded-full bg-yellow-400"></span>
                </button>
                <button onclick="ShowOutput()" class="inline-flex items-center gap-1.5 px-4 py-1.5 text-xs font-black rounded-lg bg-emerald-600 text-white shadow-md hover:bg-emerald-500 active:scale-[0.98] transition-all ml-2">
                    <svg class="w-3.5 h-3.5" fill="none" stroke="currentColor" viewBox="0 0 24 24">
                        <path stroke-linecap="round" stroke-linejoin="round" stroke-width="2.5" d="M14.752 11.168l-3.197-2.132A1 1 0 0010 9.87v4.263a1 1 0 001.555.832l3.197-2.132a1 1 0 000-1.664z"></path>
                    </svg>
                    Run Output
                </button>
            </div>
        </div>
    </div>

    <!-- Main Workspace Split Panel -->
    <main class="flex-grow flex flex-col md:flex-row md:h-[calc(100vh-120px)] w-full">

        <!-- Left Side: Editors Container -->
        <div id="editors-container" class="w-full md:w-1/2 flex flex-col min-h-[480px] md:min-h-0 border-r border-slate-800 divide-y divide-slate-800 bg-slate-950">

            <!-- HTML Panel -->
            <div id="panel-html" class="flex-1 flex flex-col overflow-hidden transition-all duration-200">
                <div class="bg-slate-900/60 px-4 py-1.5 border-b border-slate-800/60 flex items-center justify-between">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-amber-400 font-mono">index.html</span>
                </div>
                <textarea id="htmlCode" class="flex-grow bg-slate-950 p-4 font-mono text-sm text-slate-300 focus:outline-none resize-none custom-scrollbar" placeholder="<!-- Write your HTML structure here -->"></textarea>
            </div>

            <!-- CSS Panel -->
            <div id="panel-css" class="flex-1 flex flex-col overflow-hidden transition-all duration-200">
                <div class="bg-slate-900/60 px-4 py-1.5 border-b border-slate-800/60 flex items-center justify-between">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-blue-400 font-mono">style.css</span>
                </div>
                <textarea id="cssCode" class="flex-grow bg-slate-950 p-4 font-mono text-sm text-slate-300 focus:outline-none resize-none custom-scrollbar" placeholder="/* Write your CSS styling here */"></textarea>
            </div>

            <!-- JS Panel -->
            <div id="panel-js" class="flex-1 flex flex-col overflow-hidden transition-all duration-200">
                <div class="bg-slate-900/60 px-4 py-1.5 border-b border-slate-800/60 flex items-center justify-between">
                    <span class="text-[11px] font-bold uppercase tracking-wider text-yellow-400 font-mono">script.js</span>
                </div>
                <textarea id="jsCode" class="flex-grow bg-slate-950 p-4 font-mono text-sm text-slate-300 focus:outline-none resize-none custom-scrollbar" placeholder="// Write your JavaScript logic here"></textarea>
            </div>

        </div>

        <!-- Right Side: Realtime Iframe Preview -->
        <div id="preview-container" class="w-full md:w-1/2 bg-white flex flex-col min-h-[320px] md:min-h-0 md:h-full">
            <div class="bg-slate-900 border-b border-slate-800 px-4 py-1.5 flex items-center justify-between text-slate-400">
                <span class="text-[11px] font-bold uppercase tracking-wider font-mono">Live Preview Browser</span>
            </div>
            <iframe id="preview" sandbox="allow-scripts" referrerpolicy="no-referrer" title="HTML preview" class="w-full flex-grow bg-white border-none"></iframe>
        </div>

    </main>

    <!-- Custom Utilities Scrollbar Styles -->
    <style>
        .custom-scrollbar::-webkit-scrollbar {
            width: 6px;
            height: 6px;
        }
        .custom-scrollbar::-webkit-scrollbar-track {
            background: #020617;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb {
            background: #1e293b;
            border-radius: 4px;
        }
        .custom-scrollbar::-webkit-scrollbar-thumb:hover {
            background: #334155;
        }
    </style>

    <!-- Scripts Integration Linkage -->
    <script src="{{ url_for('static', filename='js/wscript.js') }}"></script>

    <!-- Mobile Menu Interactivity Script -->
    <script>
        const menuToggle = document.getElementById('menu-toggle');
        const mobileMenu = document.getElementById('mobile-menu');

        menuToggle.addEventListener('click', () => {
            mobileMenu.classList.toggle('hidden');
        });
    </script>
</body>

</html>
